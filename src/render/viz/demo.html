<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polyps — Colony Viz Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./hud.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #02060c;
      }
      .polyps-shell {
        height: 100%;
      }
      .polyps-shell canvas#colony {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="polyps-shell">
      <canvas id="colony" aria-label="Colony organism view"></canvas>
      <div class="polyps-vitals" aria-hidden="true">
        <span>nutrients<b id="v-nutrients">128</b></span>
        <span>energy<b id="v-energy" class="is-hot">64</b></span>
        <span>biomass<b id="v-biomass">42</b></span>
        <span>waste<b id="v-waste">11</b></span>
      </div>
      <div class="polyps-vitals" style="top:auto;bottom:3.5rem;background:none;opacity:0.55;font-size:0.68rem" aria-hidden="true">
        <span>● nutrients</span>
        <span style="color:#9dff7a">━ energy</span>
        <span style="color:#ffb35c">◆ waste</span>
      </div>
      <aside class="polyps-inspect" id="inspect">
        <h2>colony core</h2>
        <p>Hover to target · click for select ping · grow for birth bloom.</p>
      </aside>
      <button type="button" class="polyps-grow-hint" id="grow">grow tendril</button>
    </div>
    <script src="./colony-viz.standalone.js"></script>
    <script>
      (function () {
        const { ColonyRenderer, DEMO_SNAPSHOT } = window.PolypsViz;
        const canvas = document.getElementById("colony");
        const inspect = document.getElementById("inspect");
        const renderer = new ColonyRenderer(canvas, { interactive: true });
        let snap = JSON.parse(JSON.stringify(DEMO_SNAPSHOT));
        renderer.setSnapshot(snap);

        const labels = {
          core: ["colony core", "Metabolic heart — soft pulse anchors the organism."],
          tentacle: ["tentacle", "Feeding strand. Waves with current; draws nutrients."],
          chamber: ["digestive chamber", "Converts feedstock into energy and waste."],
          symbiont: ["symbiont cluster", "Photosynthetic glow — thrives under light."],
          membrane: ["membrane veil", "Soft shield against disturbance."],
          bud: ["reproductive bud", "Splits when biomass and genetic align."],
          sensor: ["sensor node", "Reads current and predator pressure."],
          vessel: ["vessel", "Transport lumen — amplifies adjacency flow."],
          venom: ["venom gland", "Predation spike; mineral-hungry."],
          bacteria: ["bacterial swarm", "Closes the waste loop into nutrients."],
        };

        renderer.onNodeClick(function (node) {
          if (!node) return;
          // select ping is automatic; add upgrade flash for demo clarity
          renderer.flashNode(node.id, 1.0, "upgrade");
          const L = labels[node.archetype] || [node.archetype, node.defId];
          inspect.innerHTML = "<h2>" + L[0] + "</h2><p>" + L[1] + "</p>";
          inspect.style.opacity = "0";
          requestAnimationFrame(function () {
            inspect.style.transition = "opacity 220ms ease";
            inspect.style.opacity = "1";
          });
        });

        document.getElementById("grow").addEventListener("click", function () {
          const id = "n" + (snap.nodes.length + 10);
          snap.nodes.push({
            id: id,
            defId: "tentacle",
            archetype: "tentacle",
            hue: 168,
            pulse: 1.3,
            neighbors: ["n0"],
            growth: 0,
          });
          snap.nodes.find(function (n) { return n.id === "n0"; }).neighbors.push(id);
          snap.edges.push({ from: "n0", to: id, flow: 0.7 });
          renderer.setSnapshot(snap);
          // birth flash fires from growth tween; reinforce with upgrade bloom
          setTimeout(function () { renderer.flashNode(id, 1.3, "birth"); }, 40);
        });

        let lastFlash = 0;
        function frame(ms) {
          const t = ms / 1000;
          snap.env = {
            light: 0.45 + Math.sin(t * 0.25) * 0.2,
            current: 0.25 + Math.sin(t * 0.15) * 0.15,
            disturbance: 0.02 + Math.max(0, Math.sin(t * 0.1)) * 0.08,
          };
          renderer.setSnapshot(snap);
          if (t - lastFlash > 5) {
            lastFlash = t;
            const n = snap.nodes[Math.floor(Math.random() * snap.nodes.length)];
            renderer.flashNode(n.id, 0.7);
          }
          document.getElementById("v-energy").textContent = String(
            50 + Math.floor(20 + Math.sin(t * 0.8) * 18)
          );
          renderer.draw(t);
          requestAnimationFrame(frame);
        }
        window.addEventListener("resize", function () { renderer.resize(); });
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
